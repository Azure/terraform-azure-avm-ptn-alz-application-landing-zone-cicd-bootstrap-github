---
name: Environment Info
on:
  workflow_dispatch:

jobs:
  info:
    name: Create Resource Group
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment: ${environments[keys(environments)[0]].environment_name_write}
    env:
      ARM_CLIENT_ID: "$${{ vars.AZURE_CLIENT_ID }}"
      ARM_SUBSCRIPTION_ID: "$${{ vars.AZURE_SUBSCRIPTION_ID }}"
      ARM_TENANT_ID: "$${{ vars.AZURE_TENANT_ID }}"
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: $${{ vars.AZURE_CLIENT_ID }}
          tenant-id: $${{ vars.AZURE_TENANT_ID }}
          subscription-id: $${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Create Resource Group
        shell: pwsh
        run: |
          Write-Host "=== Environment Info ==="
          Write-Host "Workflow: $${{ github.workflow }}"
          Write-Host "Repository: $${{ github.repository }}"
          Write-Host "Branch: $${{ github.ref }}"
          Write-Host ""
          Write-Host "=== Azure Connection ==="
          $account = az account show | ConvertFrom-Json
          Write-Host "Subscription: $($account.name) ($($account.id))"
          Write-Host "Tenant: $($account.tenantId)"
          Write-Host ""
          Write-Host "=== Creating Resource Group ==="
          $rgName = "rg-minimal-workflow-example"
          $location = "uksouth"
          az group create --name $rgName --location $location
          Write-Host "Resource group '$rgName' created in '$location'"
          Write-Host ""
          Write-Host "=== Cleaning Up ==="
          az group delete --name $rgName --yes --no-wait
          Write-Host "Resource group '$rgName' deletion initiated"
