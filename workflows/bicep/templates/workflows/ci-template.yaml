---
name: Continuous Integration
on:
  workflow_call:
    inputs:
      name:
        description: 'Environment Details'
        type: string
        default: ''
      display_name:
        description: 'Environment Display Name'
        type: string
        default: ''
      runner_name:
        description: 'Runner Name'
        type: string
        default: ''
      environment_name_plan:
        description: 'Environment Name Plan'
        type: string
        default: ''
      environment_name_apply:
        description: 'Environment Name Apply'
        type: string
        default: ''
      dependent_environment:
        description: 'Dependent Environment'
        type: string
        default: ''
      backend_azure_storage_account_container_name:
        description: 'Backend Azure Storage Account Container Name'
        type: string
        default: ''
      root_module_folder_relative_path:
        description: 'Root Module Folder Relative Path'
        default: '.'
        type: string

jobs:
  validate:
    name: Validate Bicep Deployment Stacks
    runs-on:
      ${{ inputs.runner_name }}
    concurrency: ${{ inputs.backend_azure_storage_account_container_name }}
    environment: ${{ inputs.environment_name_plan }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Validate Bicep Deployment Stacks
        shell: pwsh
        run: |
          $deploymentsJson = $env:BICEP_DEPLOYMENTS
          if([string]::IsNullOrEmpty($deploymentsJson)) {
            Write-Host "No BICEP_DEPLOYMENTS variable set, skipping validation"
            return
          }
          $deployments = ConvertFrom-Json $deploymentsJson
          foreach($deployment in $deployments) {
            Write-Host "--- Validating deployment stack: $($deployment.name) ---"
            $scope = if($deployment.scope) { $deployment.scope } else { "group" }
            $templateFile = "${{ inputs.root_module_folder_relative_path }}/$($deployment.template_file)"
            $arguments = @("stack", $scope, "create", "--deny-settings-mode", "none", "--action-on-unmanage", "detachAll", "--yes")

            switch($scope) {
              "group"        { $arguments += @("--resource-group", $deployment.resource_group, "--name", $deployment.name) }
              "sub"          { $arguments += @("--location", $deployment.location, "--name", $deployment.name) }
              "mg"           { $arguments += @("--location", $deployment.location, "--management-group-id", $deployment.management_group_id, "--name", $deployment.name) }
            }

            $arguments += @("--template-file", $templateFile)
            if($deployment.parameters_file) {
              $paramsFile = "${{ inputs.root_module_folder_relative_path }}/$($deployment.parameters_file)"
              $arguments += @("--parameters", "@$paramsFile")
            }
            $arguments += "--what-if"
            Write-Host "Running: az $arguments"
            az @arguments
            if($LASTEXITCODE -ne 0) { throw "Validation failed for deployment stack: $($deployment.name)" }
          }
        env:
          BICEP_DEPLOYMENTS: ${{ vars.BICEP_DEPLOYMENTS }}
