---
name: Continuous Integration
on:
  workflow_call:
    inputs:
      name:
        description: 'Environment Details'
        type: string
        default: ''
      display_name:
        description: 'Environment Display Name'
        type: string
        default: ''
      runner_name:
        description: 'Runner Name'
        type: string
        default: ''
      environment_name_read:
        description: 'Environment Name Plan'
        type: string
        default: ''
      environment_name_write:
        description: 'Environment Name Apply'
        type: string
        default: ''
      dependent_environment:
        description: 'Dependent Environment'
        type: string
        default: ''
      backend_azure_storage_account_container_name:
        description: 'Backend Azure Storage Account Container Name'
        type: string
        default: ''
      root_module_folder_relative_path:
        description: 'Root Module Folder Relative Path'
        default: '.'
        type: string
      terraform_cli_version:
        description: 'Terraform CLI Version'
        default: 'latest'
        type: string

jobs:
  plan:
    name: Validate Terraform Plan
    runs-on:
      ${{ inputs.runner_name }}
    concurrency: ${{ inputs.backend_azure_storage_account_container_name }}
    environment: ${{ inputs.environment_name_read }}
    permissions:
      id-token: write
      contents: read
    env:
      ARM_CLIENT_ID: "${{ vars.AZURE_CLIENT_ID }}"
      ARM_SUBSCRIPTION_ID: "${{ vars.AZURE_SUBSCRIPTION_ID }}"
      ARM_TENANT_ID: "${{ vars.AZURE_TENANT_ID }}"
      ARM_USE_AZUREAD: true
      ARM_USE_OIDC: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
          terraform_version: ${{ inputs.terraform_cli_versions }}

      - name: Prepare Plan Working Directory
        id: plan_paths
        shell: pwsh
        run: |
          $planDir = Join-Path $env:RUNNER_TEMP "plan-${{ github.run_id }}-${{ github.run_attempt }}"
          if (Test-Path -Path $planDir) {
            Remove-Item -Path $planDir -Recurse -Force
          }
          New-Item -Path $planDir -ItemType Directory -Force | Out-Null
          "plan_dir=$planDir" >> $env:GITHUB_OUTPUT

      - name: Terraform Init
        shell: pwsh
        run: |
          terraform `
          -chdir="${{inputs.root_module_folder_relative_path}}" `
          init `
          -backend-config="storage_account_name=${{vars.BACKEND_AZURE_STORAGE_ACCOUNT_NAME}}" `
          -backend-config="container_name=${{vars.BACKEND_AZURE_STORAGE_ACCOUNT_CONTAINER_NAME}}" `
          -backend-config="key=terraform.tfstate"

      - name: Terraform Plan
        shell: pwsh
        run: |
          $additionalVariables = ConvertFrom-Json '${{ vars.ADDITIONAL_ENVIRONMENT_VARIABLES }}'
          foreach($var in $additionalVariables.PSObject.Properties) {
            if($var.Name.StartsWith("TF_VAR_")) {
              Write-Host "Setting: $($var.Name) = $($var.Value)"
              [System.Environment]::SetEnvironmentVariable($var.Name, $var.Value)
            }
          }

          $varFilePath = "${{ vars.VAR_FILE_PATH }}"
          $action = "${{ inputs.terraform_action }}"
          $planFile = Join-Path "${{ steps.plan_paths.outputs.plan_dir }}" "tfplan"
          $planLogFile = Join-Path "${{ steps.plan_paths.outputs.plan_dir }}" "tfplan.log"

          # Run Terraform Plan
          $command = "terraform"
          $arguments = @()
          $arguments += "-chdir=${{ inputs.root_module_folder_relative_path }}"
          $arguments += "plan"

          if($varFilePath -ne "") {
            $arguments += "-var-file=$varFilePath"
          }

          $arguments += "-out=$planFile"
          $arguments += "-input=false"

          if ($action -eq 'destroy') {
            $arguments += "-destroy"
          }

          Write-Host "Running: $command $arguments"
          & $command $arguments *> $planLogFile
          $planExitCode = $LASTEXITCODE

          if ($planExitCode -ne 0) {
            # A failed plan can still have streamed resource attribute values to the log before
            # the error occurred. Only print the full captured output when the pipeline is
            # explicitly configured to show plan content; otherwise print just Terraform's own
            # diagnostic block(s) (its boxed "Error:"/"Warning:" sections), never the resource diff.
            $showPlanInPipelineLogs = "${{ vars.SHOW_PLAN_IN_PIPELINE_LOGS }}" -eq 'true'
            if ($showPlanInPipelineLogs) {
              Get-Content -Path $planLogFile | Write-Host
            } else {
              $logContent = Get-Content -Path $planLogFile -Raw
              $diagnosticBlocks = [regex]::Matches($logContent, "(?ms)^\u2577.*?^\u2575")
              if ($diagnosticBlocks.Count -gt 0) {
                foreach ($block in $diagnosticBlocks) {
                  Write-Host $block.Value
                }
              } else {
                Write-Host "Terraform plan failed. Set SHOW_PLAN_IN_PIPELINE_LOGS to true on this environment to see full plan output for troubleshooting."
              }
            }
            throw "Terraform plan failed with exit code $planExitCode."
          }

          if ("${{ vars.SHOW_PLAN_IN_PIPELINE_LOGS }}" -eq 'true') {
            Get-Content -Path $planLogFile | Write-Host
          }

      - name: Terraform Plan Summary
        shell: pwsh
        run: |
          $planFile = Join-Path "${{ steps.plan_paths.outputs.plan_dir }}" "tfplan"
          $planJsonFile = Join-Path "${{ steps.plan_paths.outputs.plan_dir }}" "tfplan.json"
          terraform -chdir="${{inputs.root_module_folder_relative_path}}" show -json $planFile > $planJsonFile
          $planJson = Get-Content -Raw $planJsonFile
          $planObject = ConvertFrom-Json $planJson -Depth 100

          $items = @{}
          foreach($change in $planObject.resource_changes) {
            $key = [System.String]::Join("-", $change.change.actions)
            if(!$items.ContainsKey($key)) {
              $items[$key] = 0
            }
            $items[$key]++
          }

          Write-Host "Plan Summary"
          Write-Host (ConvertTo-Json $items -Depth 10)

      - name: Clean Up Plan Working Directory
        if: always()
        shell: pwsh
        run: |
          $planDir = "${{ steps.plan_paths.outputs.plan_dir }}"
          if (-not [string]::IsNullOrEmpty($planDir) -and (Test-Path -Path $planDir)) {
            Remove-Item -Path $planDir -Recurse -Force
          }
